<title id="chart-title">Directions reported for each site pair</title>
<desc id="chart-desc">In the primary and wider-threshold sensitivity reports, 280 and 232 pairs respectively have both directions withheld. Community alone determines 500 versus 248 directions. Student alone determines 0 versus 48. The same site is higher in both domains for 0 versus 236 pairs. Opposite directions appear for 0 versus 16 pairs. Each report sums to 780.</desc>
